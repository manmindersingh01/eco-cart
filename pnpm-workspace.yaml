packages:
  - apps/*
  - packages/*

# Every dependency version lives in the catalog below, so each package.json
# references it with "catalog:" and the whole workspace shares one version.
catalog:
  '@aws-sdk/client-s3': ^3.1146.0
  '@aws-sdk/s3-presigned-post': ^3.1146.0
  '@aws-sdk/s3-request-presigner': ^3.1146.0
  '@better-auth/drizzle-adapter': ^1.7.7
  '@tailwindcss/postcss': ^4.3.3
  '@types/node': ^24.19.0
  '@types/pdfmake': ^0.3.3
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  auth: ^1.7.7
  better-auth: ^1.7.7
  csv-parse: ^7.0.3
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  fflate: ^0.8.3
  next: ^16.3.7
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  pdfmake: ^0.3.11
  pg: ^8.23.0
  pg-boss: ^12.35.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  read-excel-file: ^9.3.12
  sharp: ^0.35.5
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  unpdf: ^1.8.1
  vitest: ^5.0.2
  zod: ^4.6.5
catalogMode: strict
catalogPrune: true

# esbuild (pulled in by drizzle-kit) only re-checks its platform binary in its
# install script, and pnpm already installs that binary as an optional package.
allowBuilds:
  esbuild: false
# pdfmake's types pull in the browser's DOM types for two browser-only
# methods (open and print), which would let Node code in packages/core use
# browser globals without an error. The patch removes that one reference.
patchedDependencies:
  '@types/pdfmake@0.3.3': patches/@types__pdfmake@0.3.3.patch
