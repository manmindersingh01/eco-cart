packages:
  - apps/*
  - packages/*

# Every dependency version lives in the catalog below, so each package.json
# references it with "catalog:" and the whole workspace shares one version.
catalog:
  '@tailwindcss/postcss': ^4.3.3
  '@types/node': ^24.19.0
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next: ^16.3.7
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  pg: ^8.23.0
  pg-boss: ^12.35.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vitest: ^5.0.2
catalogMode: strict
catalogPrune: true
