# Local development services, started with `pnpm db:up`.
# The database matches production: PostgreSQL 16 with pgvector in Docker.
# Host port 15434 avoids Windows excluded port ranges and local Postgres conflicts.
name: ecokart

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ecokart
      POSTGRES_PASSWORD: ecokart
      POSTGRES_DB: ecokart
    ports:
      - '${POSTGRES_PORT:-15434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecokart -d ecokart']
      interval: 2s
      timeout: 5s
      retries: 15

  # Catches every email (and, with SMS_PROVIDER=mailpit, every SMS) the worker
  # sends locally. Inbox at http://localhost:8025. Never used in production.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 15

  # S3-compatible object storage for product photos, imports, and invoices,
  # standing in for the S3 bucket and CloudFront locally. Public photos load
  # from http://localhost:8333/ecokart/images/... Never used in production.
  # `pnpm db:up` creates the bucket (packages/core/src/lib/storage-setup.ts).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-dir=/data', '-master.telemetry=false']
    environment:
      AWS_ACCESS_KEY_ID: ecokart
      AWS_SECRET_ACCESS_KEY: development-only-storage-secret
    ports:
      - '${STORAGE_PORT:-8333}:8333'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  storage-data:
