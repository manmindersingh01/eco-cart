# Local development database. Matches production: PostgreSQL 16 with pgvector.
# Host port 5434 avoids clashing with a Postgres already running on 5432.
name: ecokart

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ecokart
      POSTGRES_PASSWORD: ecokart
      POSTGRES_DB: ecokart
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecokart -d ecokart']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
