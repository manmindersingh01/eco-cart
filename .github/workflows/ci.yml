name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Same major version and extensions as production (RDS PostgreSQL 16).
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: ecokart
          POSTGRES_PASSWORD: ecokart
          POSTGRES_DB: ecokart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecokart -d ecokart"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://ecokart:ecokart@localhost:5432/ecokart

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version from packageManager and the Node.js version
      # from devEngines.runtime in package.json, then runs pnpm install.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
